name: Diagnóstico ECMWF
on:
  push:
    branches: [diag-ecmwf]
jobs:
  sondeo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt eccodes
      - run: python diag/sondeo.py
